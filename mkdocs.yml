site_name: termforge
site_description: Vim-inspired terminal UI framework for Go — split-tree windows, tabs, colon commands, and a built-in terminal emulator on tcell
site_url: https://yairgd.github.io/termforge/
repo_url: https://github.com/yairgd/termforge
repo_name: yairgd/termforge
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: _site
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: README.md
  - Architecture:
      - UI Architecture: UI_ARCHITECTURE.md
      - Window Management: WINDOW_MANAGEMENT.md
      - Rendering: RENDERING.md
  - Input and commands:
      - Input: INPUT.md
      - Command System: COMMAND_SYSTEM.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/vendor/panzoom.min.js
  - javascripts/mermaid-zoom.js

plugins:
  - search

extra:
  seo:
    image: https://yairgd.github.io/termforge/media/termforge-social.png
    image_alt: termforge terminal UI framework
    author: termforge contributors

copyright: Copyright &copy; 2026 termforge contributors
